[build]
  publish = "."
  functions = "netlify/functions"

# Endpoint principal para capturar el lead (Supabase + Resend + Triggers)
[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead"
  status = 200
  force = true

# Endpoint para recibir Webhooks de Resend (email.opened, email.clicked, etc.)
[[redirects]]
  from = "/api/resend-webhook"
  to = "/.netlify/functions/resend-webhook"
  status = 200
  force = true

# Redirecciones amigables hacia la URL principal del Lead Magnet
[[redirects]]
  from = "/"
  to = "/las-10-reglas-de-oro-de-un-equipo-de-limpieza/"
  status = 302
  force = true

[[redirects]]
  from = "/Las 10 reglas de oro de un equipo de limpieza"
  to = "/las-10-reglas-de-oro-de-un-equipo-de-limpieza/"
  status = 301

[[redirects]]
  from = "/las-10-reglas-de-oro"
  to = "/las-10-reglas-de-oro-de-un-equipo-de-limpieza/"
  status = 301

[[redirects]]
  from = "/guia"
  to = "/las-10-reglas-de-oro-de-un-equipo-de-limpieza/"
  status = 301

[[redirects]]
  from = "/guia/"
  to = "/las-10-reglas-de-oro-de-un-equipo-de-limpieza/"
  status = 301

[[redirects]]
  from = "/guia/gracias"
  to = "/las-10-reglas-de-oro-de-un-equipo-de-limpieza/gracias/"
  status = 301

[[redirects]]
  from = "/guia/gracias/"
  to = "/las-10-reglas-de-oro-de-un-equipo-de-limpieza/gracias/"
  status = 301

[[redirects]]
  from = "/gracias"
  to = "/las-10-reglas-de-oro-de-un-equipo-de-limpieza/gracias/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
